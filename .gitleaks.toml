[extend]
useDefault = true

# Public deterministic ECDH reference material (private scalars 1/2 and 3/4).
# Keep normal detectors enabled; never exclude whole files or commits.
[[allowlists]]
description = "Exact public G7 known-answer vector, not sensor credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''^dexcom-g7/src/test/resources/auth-reference/java-peer\.properties$''',
]
regexes = [
  '''F4ZBxrR3KPHRBo6n0UsUoA==''',
]

[[allowlists]]
description = "Literal English packet-order description incorrectly detected as an API key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''^docs/superpowers/plans/2026-11-03-g7-authentication-boundary\.md$''']
regexes = ['''auth ordering, completion/rebond''']
