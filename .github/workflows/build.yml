name: build
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate branch protection helper with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/protect-main.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw 'tools/protect-main.ps1 failed PowerShell 7 parsing.'
          }
      - name: Prepare Watch Face Push marketplace assets
        shell: pwsh
        run: ./tools/watchface-push/Prepare-WatchFacePushAssets.ps1
      - name: Test and build all applications and watchfaces
        run: >-
          ./gradlew test assembleDebug
          :watchfaces:test-wff:assembleRelease
          :watchfaces:aaps-v4:assembleRelease
          :watchfaces:aaps-v2:assembleRelease
          :watchfaces:aaps-circle:assembleRelease
          :watchfaces:aaps-digital-style:assembleRelease
          :watchfaces:aaps-standard:assembleRelease
          :watchfaces:aaps-big-chart:assembleRelease
          :watchfaces:aaps-large:assembleRelease
          :watchfaces:aaps-no-chart:assembleRelease
          :watchfaces:aaps-cockpit:assembleRelease
          :watchfaces:aaps-v2-tt-dark:assembleRelease
          :watchfaces:aaps-community:assembleRelease
          :watchfaces:aimico:assembleRelease
          :watchfaces:analog-g-watch:assembleRelease
          :watchfaces:blue-ring:assembleRelease
          :watchfaces:digital-big-graph:assembleRelease
          :watchfaces:digital-g-watch:assembleRelease
          :watchfaces:gears:assembleRelease
          :watchfaces:gota:assembleRelease
          :watchfaces:lucky-loop-koeln:assembleRelease
          :watchfaces:p-zero:assembleRelease
          :watchfaces:robby:assembleRelease
          :watchfaces:simple-digital:assembleRelease
          :watchfaces:steam-punk:assembleRelease
      - name: Upload G7 Collector visual QA previews
        uses: actions/upload-artifact@v4
        with:
          name: g7-collector-visual-qa
          path: g7watch/build/reports/g7-visual-qa/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android widget visual QA previews
        uses: actions/upload-artifact@v4
        with:
          name: android-widget-visual-qa
          path: app-mobile/build/reports/widget-visual-qa/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Lint Mobile and Wear frontend
        run: ./gradlew :app-mobile:lintDebug :app-wear:lintDebug
      - name: Validate Watch Face Format XML
        shell: pwsh
        run: ./tools/wff-validator/validate.ps1
      - name: Verify code-free watchface APKs
        shell: pwsh
        run: ./tools/verify-codefree-watchfaces.ps1
