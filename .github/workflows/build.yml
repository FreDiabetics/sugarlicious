name: build

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Reject committed secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git merge-base origin/main "$HEAD_SHA")"
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BASE_SHA" == "$HEAD_SHA" ]]; then
            log_opts="-1 $HEAD_SHA"
          else
            log_opts="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code=2 \
            --log-opts="$log_opts" --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks.sarif" .
      - name: Upload redacted secret-scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: false

      - name: Install Android API 37
        run: |
          test -s "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          test -s "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          android --no-metrics sdk install "platforms;android-37" "build-tools;37.0.0" --canary

      - name: Validate branch protection helper with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/protect-main.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw 'tools/protect-main.ps1 failed PowerShell 7 parsing.'
          }

      - name: Prepare Watch Face Push marketplace assets
        shell: pwsh
        run: ./tools/watchface-push/Prepare-WatchFacePushAssets.ps1

      - name: Check Orbit geometry and editor assets
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 -m unittest discover -s tools/tests -p test_orbit_face.py

      - name: Enforce Kotlin static analysis and formatting
        run: ./gradlew detekt ktlintCheck

      - name: Test and build all applications and watchfaces
        run: >-
          ./gradlew verifyArchitecture test assembleDebug
          :watchfaces:test-wff:assembleRelease
          :watchfaces:sugarlicious-digital:assembleRelease
          :watchfaces:sugarlicious-analog:assembleRelease
          :watchfaces:sugarlicious-direct-to-watch:assembleRelease
          :watchfaces:sugarlicious-orbit:assembleRelease

      - name: Upload G7 Collector visual QA previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g7-collector-visual-qa
          path: g7watch/build/reports/g7-visual-qa/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android widget visual QA previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-widget-visual-qa
          path: app-mobile/build/reports/widget-visual-qa/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Lint all Android modules
        run: ./gradlew lint

      - name: Validate Watch Face Format XML
        shell: pwsh
        run: ./tools/wff-validator/validate.ps1

      - name: Verify code-free watchface APKs
        shell: pwsh
        run: ./tools/verify-codefree-watchfaces.ps1

      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: sugarlicious-sbom.spdx.json
